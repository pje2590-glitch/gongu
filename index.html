<style>html{color-scheme:light dark}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}.loadcard{text-align:center;padding:34px 18px}.loadcard .spin{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--ok-bg);border-top-color:var(--ok);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* 한글이 한 글자씩 잘려 줄바꿈되지 않게 — 단어 단위로 넘기기 */
html,body{word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,.t,.brand,.hd b,.nm,b{text-wrap:balance}
p,.help,.q,dd,span{text-wrap:pretty}
.num,.amt,.pill,.brand small{white-space:nowrap}

.fitme,.line>span:first-child,.line.item .nm,.line.item .q{min-width:0;overflow:hidden}

/* 옆으로 삐져나가거나 화면이 튕기지 않게 */
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior:none}
.top .brand{min-width:0;max-width:100%;overflow:hidden}
.brand:not(:has(.logo)){display:block}
.brand:not(:has(.logo)) small{margin-top:4px}
.tabs{flex-wrap:nowrap!important}.tabs>[role=tab]{min-width:0;flex:1 1 auto;overflow:hidden}
#syncBadge{position:fixed;left:12px;bottom:12px;z-index:50;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card);color:var(--muted);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08);transition:opacity .4s}#syncBadge.ok{color:var(--ok)}#syncBadge.bad{color:var(--bad);border-color:var(--bad)}#syncBadge.hide{opacity:0;pointer-events:none}
</style>

<style>
/* Layout: 공구 칩 → PC는 [내 화면 | 참여자 화면] 두 칸, 폰은 토글. 각 칸은 탭. 색은 민트 바탕·흰 카드·초록(확인/강조)·빨강(조치 필요)·네이비(운송장) 넷만 */
:root{
  --bg:#E8EAF7; --card:#FFFFFF; --ink:#272B45; --muted:#7F849C; --line:#DFE2F2; --soft:#F1F2FA;
  --ok:#5662B0; --ok-bg:#EEF0FB; --ok-strong:#BAC2EE; --on-accent:#2E3770;
  --bad:#C9413E; --bad-bg:#FBEAEA;
  --navy:#272B4A; --navy-ink:#FFFFFF;
  --cvs-bg:#FFF4CC; --cvs:#8A6300; --visit-bg:#E2EEFA; --visit:#2F5F9E;
  --mem-bg:#EFEAF7; --mem-line:#D6CBE8; --mem-ink:#6A4C93;
  --tr-bg:#FFF4CF; --tr-line:#F1D27A; --tr-ink:#8A5A00; --fm-bg:#E3EFFB; --fm-line:#AFCBEA; --fm-ink:#2F5F9E;
  --body:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --title:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17182A; --card:#222439; --ink:#EEEFF8; --muted:#9B9EB9; --line:#33364F; --soft:#2B2D44;
  --ok:#B9C1EC; --ok-bg:#262A40; --ok-strong:#9AA4E0; --on-accent:#1C2150; --bad:#F09490; --bad-bg:#3D2424; --navy:#12142B; --navy-ink:#F4F7FA; --cvs-bg:#3D3415; --cvs:#F2D479; --visit-bg:#1E2F44; --visit:#9CC4F0; --mem-bg:#221E2B; --mem-line:#3A3248; --mem-ink:#C9B3EA; --tr-bg:#3A3214; --tr-line:#6B5A22; --tr-ink:#F2D479; --fm-bg:#1E2F44; --fm-line:#36506F; --fm-ink:#9CC4F0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17182A; --card:#222439; --ink:#EEEFF8; --muted:#9B9EB9; --line:#33364F; --soft:#2B2D44;
  --ok:#B9C1EC; --ok-bg:#262A40; --ok-strong:#9AA4E0; --on-accent:#1C2150; --bad:#F09490; --bad-bg:#3D2424; --navy:#12142B; --navy-ink:#F4F7FA; --cvs-bg:#3D3415; --cvs:#F2D479; --visit-bg:#1E2F44; --visit:#9CC4F0; --mem-bg:#221E2B; --mem-line:#3A3248; --mem-ink:#C9B3EA; --tr-bg:#3A3214; --tr-line:#6B5A22; --tr-ink:#F2D479; --fm-bg:#1E2F44; --fm-line:#36506F; --fm-ink:#9CC4F0; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 26px) 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap>.top{margin-bottom:6px}
.wrap>.chips{margin-bottom:10px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}

function distribute(g){
  g.carts.forEach((c,ci)=>{
    const mem=g.members.filter(m=>(m.cart||0)===ci);
    if(isFeeG(g)){mem.forEach(m=>{if(!m.ovManual)m.overseas=0;});return;} // 수고비 공구: 해외배송비 없음
    const auto=mem.filter(m=>!m.ovManual); if(!auto.length) return;
    const fixed=mem.filter(m=>m.ovManual).reduce((a,m)=>a+(+m.overseas||0),0);
    const pool=Math.max(0,(+c.ovTotal||0)-fixed);

  });

function allocate(g){
  const f=g.form||blankForm(); const res=[...(f.responses||[])].sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);

    const cap=p.cap>0?p.cap:Infinity; const take=Math.max(0,Math.min(q,cap-got[pid])); all.push({rid:r.id,nick:r.nick,at:r.at,pid,name:p.name,price:p.price,q:take,wanted:q}); got[pid]+=take;}});
  const viable={}; f.products.forEach(p=>viable[p.id]=got[p.id]>0&&got[p.id]>=(p.minTarget||1));

}

function render(){
  applyFonts();
  const app=document.getElementById('app'); let g=G(); if(g) V.gid=g.id;
  if(formView){
    const fg=S.groups.find(x=>x.id===formView);
    app.innerHTML=`<div class="top guest"><div class="brand">${fg?esc(fg.title)+' 공구':'모집폼'}<small>${fg?'수요조사 · '+esc(nickOf(fg)):''}</small></div></div><div class="cols single"><div class="panel">${fg?renderForm(fg):LOADING?`<div class="card loadcard"><div class="spin"></div><h2>불러오는 중이에요</h2><p class="help">잠시만 기다려 주세요. 처음 열 때는 몇 초 걸릴 수 있어요.</p></div>`:`<div class="card"><h2>${LOADFAIL?'연결이 잠깐 끊겼어요':'폼을 찾을 수 없어요'}</h2>${LOADFAIL?'<p><button class="btn p" onclick="location.reload()">다시 불러오기</button></p>':''}<p class="help">링크를 다시 확인해 주세요.</p></div>`}</div></div>`;

  bind();
}

      <div class="row"><button class="btn s" data-copy="${esc(S.seller.bank+' '+S.seller.acct+' '+S.seller.holder)}" data-label="은행·계좌·예금주">은행+계좌 복사</button>${amount?`<button class="btn s" data-copy="${amount}" data-label="입금 금액">입금액 ${won(amount)} 복사</button>`:''}</div>

function splitCarts(prods,qtyOf,usable){
  /* 단가 큰 것부터, 들어가는 첫 장바구니에 넣기 */
  const units=[]; prods.forEach(p=>{const q=qtyOf(p);for(let i=0;i<q;i++)units.push(p);}); units.sort((x,y)=>y.fx-x.fx);
  const carts=[]; const over=[];
  units.forEach(p=>{ if(p.fx>usable){over.push(p);return;} let c=carts.find(c=>c.sum+p.fx<=usable+1e-9); if(!c){c={sum:0,items:{}};carts.push(c);} c.sum+=p.fx; c.items[p.id]=(c.items[p.id]||0)+1; });
  return {carts,over};
}
function cartCalcBox(g){

      <div class="tile"><small>여유 금액 (${cur.name})</small><input id="marginLocal" inputmode="numeric" value="${margin}" style="padding:4px 8px;font-size:15px;font-weight:700"></div>
    </div>
    <div class="row" style="margin-top:8px"><span class="help">수량 기준:</span><label class="sw"><input type="radio" name="basis" value="min" ${basis==='min'?'checked':''}> 최소 목표</label><label class="sw"><input type="radio" name="basis" value="max" ${basis==='max'?'checked':''}> 매장 최대</label><span class="help">· 장바구니 1개 상한 = ${fmtLocal(g,limitLocal)} − ${fmtLocal(g,margin)} = <b>${fmtLocal(g,usable)}</b></span></div>
    ${prods.length?`

function groupMessage(g){
  const head=`[${g.title} 공구] 💌\n상황 공유드립니다 :)`;
  if(g.step<0) return `${head}\n🧸 현재 : 1차 입금 확인 중 (${g.members.filter(paid1).length}/${g.members.length}명)\n✈️ 다음 단계 : 입금이 모이면 바로 주문할게요!\n오늘도 행복 가득 하루 되세요 ! 🌷💛`;
  const s=STEPS[g.step], h=g.history.find(x=>x.step===g.step), nx=STEPS[g.step+1];
  return `${head}\n🧸 현재 : ${s.t}${h&&h.memo?` (${h.memo})`:''}\n✈️ 다음 단계 : ${nx?nx.t:'끝! 모두 받으셨는지 확인해 주세요'}${s.k==='ship'?'\n📦 운송장 번호는 각자 정산서 링크에서 확인할 수 있어요':''}\n오늘도 행복 가득 하루 되세요 ! 🌷💛`;
}
function stage2Message(g){return `[${g.title} 공구] 💌\n2차 정산(해외배송비 + 국내배송비) 안내드립니다 :)\n🧾 각자 정산서 링크에서 금액 확인 후 입금 부탁드려요\n🏦 ${S.seller.bank} ${S.seller.acct} (${S.seller.holder})\n📎 배송비 결제 내역은 정산서의 "증빙 서류"에서 볼 수 있어요\n오늘도 행복 가득 하루 되세요 ! 🌷💛`;}
function indivList(g){return g.members.filter(m=>r1(m)>0||(g.stage2Open&&r2(m)>0)).map(m=>{const parts=[];if(r1(m))parts.push(`1차 ${won(r1(m))}`);if(g.stage2Open&&r2(m))parts.push(`2차 ${won(r2(m))}`);return {name:m.name,text:`${m.name}님 안녕하세요 🙂 [${g.title} 공구] ${parts.join(' + ')} 입금 부탁드려요 💛\n${S.seller.bank} ${S.seller.acct} (${S.seller.holder})\n오늘도 행복 가득 하루 되세요 ! 🌷`};});}
function indivMessages(g){return indivList(g).map(x=>x.text).join('\n\n');}

/* 이벤트 */
function bind(){
  const app=document.getElementById('app'); const g=G();
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{V.mode=b.dataset.mode;saveView();render();});
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.tab.split(':');if(k==='a')V.tabA=id;else V.tabM=id;saveView();render();});
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.sub.split(':');V.sub[k]=id;saveView();render();});
  app.querySelectorAll('.chips [data-g]').forEach(b=>b.onclick=()=>{V.gid=b.dataset.g;V.mid=null;saveView();render();});
  const sp=document.getElementById('showPast'); if(sp) sp.onclick=()=>{V.showPast=!V.showPast;saveView();render();};
  const cg=document.getElementById('closeG'); if(cg) cg.onclick=e=>{if(e.target.dataset.armed){g.closed=true;g.closedAt=now();g.form.open=false;V.gid=S.groups.find(x=>!x.closed)?.id||g.id;save();render();toast('공구를 마감했어요. 참여자 링크는 닫히고 기록은 지난 공구에 남습니다');}else{e.target.dataset.armed='1';e.target.textContent='정말 마감? (다시 누르기)';}};
  const rg=document.getElementById('reopenG'); if(rg) rg.onclick=()=>{g.closed=false;g.closedAt='';save();render();toast('마감을 취소했어요. 참여자 링크가 다시 열립니다');};
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b.dataset.label));
  app.querySelectorAll('[data-copy-el]').forEach(b=>b.onclick=()=>copyText(document.getElementById(b.dataset.copyEl).textContent,b.dataset.label));
  const ag=document.getElementById('addG'); if(ag) ag.onclick=addGroup;
  app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{V.section=b.dataset.section;const f=S.groups.find(x=>(V.section==='trade')===(x.kind==='trade')&&!x.closed);V.gid=f?f.id:null;V.mid=null;saveView();render();document.getElementById('scroller').scrollTop=0;});
  const sg=document.getElementById('seedGo'); if(sg) sg.onclick=async()=>{const pw=v('seedPw');if(!pw)return toast('비밀번호를 넣어 주세요');sg.disabled=true;const ok=await tryImportSeed(pw,true);sg.disabled=false;if(ok){V.adminKey=pw;saveView();syncPush();}};
  const hm=app.querySelector('[data-home]'); if(hm) hm.onclick=()=>{V.section=null;saveView();render();};
  if(!g) return;
  if(g.kind==='trade'){bindTrade(g);return;}
  const M=id=>g.members.find(x=>x.id===id);
  const m=g.members.find(x=>x.id===V.mid)||g.members[0];

  app.querySelectorAll('[data-pickm]').forEach(b=>b.onclick=()=>{V.mid=b.dataset.pickm;saveView();render();});
  const dof=document.getElementById('demoOff'); if(dof) dof.onclick=()=>{S.groups=S.groups.filter(x=>!x.demo);try{localStorage.setItem(DEMO_FLAG,'1');}catch(e){}V.gid=null;save();render();toast('예시 공구를 지웠어요');};
  const ea=document.getElementById('editAddr'); if(ea) ea.onclick=()=>{document.getElementById('addrForm').hidden=false;ea.hidden=true;};
  const ad=document.getElementById('a_delivery'); if(ad) ad.onchange=()=>{document.getElementById('a_home').hidden=ad.value!=='normal';document.getElementById('a_cvsbox').hidden=ad.value!=='convenience';};
  const rff=document.getElementById('rfForm'); if(rff&&m) rff.onsubmit=e=>{e.preventDefault();const b=v('rf_bank'),a=v('rf_acct').replace(/[^0-9-]/g,''),h=v('rf_holder');if(!b||!a||!h){toast('은행·계좌번호·예금주를 모두 넣어 주세요');return;}m.refundBank=b;m.refundAcct=a;m.refundHolder=h;m.rfAt=now();pushRefund(m);render();};

function parseProductText(txt){
  const lines=String(txt||'').split(/\r?\n/).map(x=>x.replace(/[|·•\t]+/g,' ').trim()).filter(Boolean); const out=[]; let cat='';
  for(const ln of lines){
    const limitM=ln.match(/(?:1인|한\s*사람|한\s*분|お一人様?|各|1名)\s*(?:당|)?\s*(\d+)\s*(?:개|点|つ|個)?|(\d+)\s*(?:개|点|個)\s*(?:제한|限定|까지|まで)/);
    let rest=limitM?ln.replace(limitM[0],' '):ln;
    const priceM=rest.match(/(?:¥|￥|円|엔|\$|€)?\s*(\d{1,3}(?:,\d{3})+|\d{3,7})\s*(?:円|엔|원|JPY|yen)?/i);
    if(!priceM){ if(ln.length<=20) cat=ln.replace(/[\[\]【】<>#*]/g,'').trim(); continue; }
    const name=rest.replace(priceM[0],' ').replace(/[¥￥円엔원:：\-–—()（）]/g,' ').replace(/\b(JPY|yen)\b/ig,' ').replace(/\s+/g,' ').trim();
    if(!name) continue;
    out.push({name,fx:+priceM[1].replace(/,/g,''),maxPer:limitM?+(limitM[1]||limitM[2])||1:1,cat});
  }
  return out;
}

function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=url;});}

    box.querySelector('#e_save').onclick=()=>{pull();if(!m.name){toast('이름을 입력해 주세요');return;}if(JSON.stringify(SELF_F.map(k=>m[k]))!==snap)m.selfAt=now();m.extra2=(m.extra2||[]).filter(i=>i.n);m.items=m.items.filter(i=>i.n);if(!m.items.length)m.items=[{n:'(상품 미정)',q:1,p:0,fx:0,fee:0}];distribute(g);save();render();toast('저장했어요');};
  };
  draw();row.after(box);box.querySelector('#e_name').focus();
}


/* ===== 번개장터 택배 거래: 캡처 글자 → 거래별 정리 ===== */
const T_LABELS=/^(주문\s*상세|판매\s*정보|배송지\s*정보|거래\s*정보|거래\s*요청\s*사항|예약\s*정보|자주\s*묻는\s*질문|번개톡|배송\s*준비\s*중?|상품\s*준비\s*중|배송\s*완료|픽업\s*대기|상품\s*접수\s*대기\s*중?|예약\s*완료|이용\s*안내|예약\s*취소|예약\s*변경|판매\s*불가|운송장.*|배송\s*방법\s*변경|배송\s*예약.*|어디로.*|내\s*계좌로.*|번개머니.*|선택한.*|무음.*|서비스|예약번호|유효기간|상품정보|배송료|보내는\s*사람|받는\s*사람|구매자|거래방법|진행중|전체|판매완료|취소\/환불|정산내역|거래내역)$/;
const T_PHONE=/(0(?:1[016789]|50\d|2|[3-6]\d|70)[-.\s]?\d{3,4}[-.\s]?\d{4})(\s*\(?\s*안심\s*번호\s*\)?)?/;
const T_CVS=/((?:GS25|GS|CU|세븐일레븐|이마트24|emart24)\s*[가-힣A-Za-z0-9]+점)/;
const tDigits=s=>String(s||'').replace(/\D/g,'');
const tNum=s=>+String(s||'').replace(/[^\d]/g,'')||0;
const tFmtPhone=s=>{const d=tDigits(s);if(d.length===11)return d.replace(/(\d{3,4})(\d{4})(\d{4})/,'$1-$2-$3');if(d.length===12)return d.replace(/(\d{4})(\d{4})(\d{4})/,'$1-$2-$3');if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');return s||'';};
/* 줄바꿈으로 끊긴 주소 잇기: 쉼표 뒤만 띄우고 나머지는 붙임 (폰 화면은 글자 단위로 줄이 바뀜) */
function tJoin(lines){let s='';lines.forEach(l=>{l=l.trim();if(!l)return;if(!s){s=l;return;}s+=(/[,，]$/.test(s)||(/[가-힣]$/.test(s)&&/^\d/.test(l)))?' '+l:l;});return s.replace(/\s+/g,' ').trim();}
function tSplitAddr(full){const s=String(full||'').trim();let m=s.match(/^(.*\))\s*,\s*(.+)$/);if(m)return [m[1].trim(),m[2].trim()];const i=s.lastIndexOf(',');if(i>0)return [s.slice(0,i).trim(),s.slice(i+1).trim()];return [s,''];}
function tLines(text){return String(text||'').replace(/\r/g,'').replace(/[ㆍ•∙・]/g,'·').replace(/[～〜]/g,'~').replace(/[›＞]/g,'>').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/^\d{1,2}[:;]\d{2}$/.test(x));}
const tNick=s=>{s=String(s||'').replace(/^[^가-힣A-Za-z0-9]+/,'').replace(/\s*>\s*$/,'').trim();return /[가-힣A-Za-z0-9]{2,}/.test(s)&&!/^(거래|거래방법|구매자|번개톡)$/.test(s)?s:'';};
const tIsName=s=>!!s&&/^[가-힣A-Za-z][가-힣A-Za-z0-9 ]{0,14}$/.test(s)&&!T_LABELS.test(s)&&!/^(GS|CU)/.test(s);
function tAmountAfter(text,re){const m=text.match(re);return m?tNum(m[1]):0;}

/* 거래내역 목록 캡처: 카드 여러 개 → 조각 여러 개 */
function tParseList(lines){
  const nickIdx=[];lines.forEach((l,i)=>{const m=l.match(/^(.*?)\s*\/\s*(택배\s*거래|직거래|택배)$/);if(m&&m[1].trim()){const nk=tNick(m[1].trim().split(' ').pop());if(nk)nickIdx.push({i,nick:nk});}});
  const prices=[];lines.forEach((l,i)=>{const m=l.match(/^(?:[^\d+\-]{0,6}\s)?(\d{1,3}(?:,\d{3})+)\s*원$/);if(m)prices.push({i,v:tNum(m[1])});});
  const items=[];lines.forEach((l,i)=>{if(/^\S{0,4}\s*\[/.test(l)&&/\]/.test(l))items.push({i,v:l.replace(/^[^\[]*/,'')});});
  const btn=[];lines.forEach((l,i)=>{if(/배송\s*예약\s*완료/.test(l))btn.push({i,v:'reserved'});else if(/배송\s*예약\s*하기/.test(l))btn.push({i,v:'need'});});
  const same=prices.length===nickIdx.length, sameI=items.length===nickIdx.length, sameB=btn.length===nickIdx.length;
  const near=(arr,i)=>{let best=null;arr.forEach(a=>{if(a.i<i&&(!best||a.i>best.i))best=a;});return best;};
  const after=(arr,i,j)=>arr.find(a=>a.i>i&&(j==null||a.i<j));
  return nickIdx.map((n,k)=>{const nx=nickIdx[k+1]?nickIdx[k+1].i:null;
    const p=same?prices[k]:near(prices,n.i), it=sameI?items[k]:near(items,n.i), b=sameB?btn[k]:after(btn,n.i,nx);
    return {src:'list',nick:n.nick,price:p?p.v:0,item:it?it.v:'',listStatus:b?b.v:''};});
}

/* 캡처 한 장(또는 붙여 넣은 글 한 덩어리) → 조각 배열 */
function tParse(text,me){
  me=me||{};const lines=tLines(text);const all=lines.join('\n');
  if(!lines.length) return [];
  // 1) 거래내역 목록
  if(lines.some(l=>/\/\s*택배\s*거래$/.test(l))&&!/주문\s*번호/.test(all)) return tParseList(lines);
  const f={src:'detail',raw:String(text).slice(0,3000)};
  // 2) 배송 예약 정보
  const rv=all.match(/(?:^|[^\d])([1-9]\d{3})[-\s](\d{4})[-\s](\d{4})(?!\d)/);
  if(rv&&/예약|반값|편의점\s*택배|서비스/.test(all)){
    f.src='resv'; f.resvNo=`${rv[1]}-${rv[2]}-${rv[3]}`;
    f.resvService=/반값/.test(all)?'GS25 반값택배':/편의점\s*택배/.test(all)?'편의점택배':'';
    const u=all.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(\(\s*[월화수목금토일]\s*\))?\s*까지/); if(u) f.resvUntil=`${+u[1]}월 ${+u[2]}일${u[3]?' '+u[3].replace(/\s/g,''):''}`;
    const at=all.match(/예약\s*완료\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(\d{1,2}[:;]\d{2})/); if(at) f.resvAt=`${+at[1]}월 ${+at[2]}일 ${at[3].replace(';',':')}`;
    // 상품정보 (두 줄로 나뉘면 이어 붙임)
    const ii=lines.findIndex(l=>/\[[^\]]+\]/.test(l)); if(ii>=0){let it=lines[ii].replace(/^.*?(\[)/,'$1').replace(/^상품\s*정보\s*/,'');const nx=lines[ii+1]; if(nx&&!/\d{3}|배송료|보내는|받는|선불|·/.test(nx)&&nx.length<=30) it+=' '+nx; f.item=it.trim(); f.itemFull=true;}
    // 받는 사람: "이름 · 전화" 쌍 중 내 것이 아닌 마지막 것
    const pairs=[];lines.forEach((l,i)=>{const m=l.match(/([가-힣A-Za-z][가-힣A-Za-z0-9 ]{0,14}?)\s*·\s*(0\d{1,3}[-.\s]?\d{3,4}[-.\s]?\d{4})/);if(m)pairs.push({i,name:m[1].replace(/^(받는\s*사람|보내는\s*사람)\s*/,'').trim(),phone:m[2]});});
    const myP=tDigits(me.phone), myN=String(me.name||'').trim();
    const recvIdx=lines.findIndex(l=>/받는\s*사람/.test(l));
    let cand=pairs.filter(p=>!(myP&&tDigits(p.phone)===myP)&&!(myN&&p.name===myN));
    if(recvIdx>=0){const af=cand.filter(p=>p.i>=recvIdx); if(af.length) cand=af;}
    const r=cand[cand.length-1];
    if(r){ f.rName=r.name; f.rPhone=tFmtPhone(r.phone);
      const cv=lines.slice(Math.max(0,r.i-2),r.i+1).join(' ').match(T_CVS)||all.slice(all.indexOf(r.phone)).match(T_CVS);
      // 반값택배: 받는 사람 위·아래에 편의점명
      const cvs2=(()=>{for(let k=Math.max(0,(recvIdx>=0?recvIdx:r.i-2));k<=Math.min(lines.length-1,r.i+1);k++){const m=lines[k].match(T_CVS);if(m)return m[1];}return '';})();
      if(cvs2||(/반값/.test(all)&&cv)) f.cvs=(cvs2||cv[1]).replace(/\s+/g,'');
      else { const ad=[];for(let k=r.i+1;k<Math.min(lines.length,r.i+4);k++){const l=lines[k];if(T_LABELS.test(l)||/자주|이용안내/.test(l))break;if(/[가-힣]/.test(l)||/^\d/.test(l))ad.push(l);} if(ad.length){const [a,b]=tSplitAddr(tJoin(ad)); f.addr=a; f.addr2=b;} }
    }
    return [f];
  }
  // 3) 주문 상세
  const on=all.match(/주문\s*번호\s*[:#]?\s*(\d{9})(?!\d)/)||all.match(/(?:^|[^\d])(1\d{8})(?!\d)/); if(on) f.orderNo=on[1];
  const oa=all.match(/(\d{2})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(\d{1,2})[:;]?(\d{2})/); if(oa) f.orderAt=`20${oa[1]}-${String(oa[2]).padStart(2,'0')}-${String(oa[3]).padStart(2,'0')} ${oa[4]}:${oa[5]}`;
  else {const od=all.match(/(20\d{2})\.(\d{1,2})\.(\d{1,2})/); if(od) f.orderAt=`${od[1]}-${od[2].padStart(2,'0')}-${od[3].padStart(2,'0')}`;}
  const nk=all.match(/구매자\s*[:]?\s*([^\n>]+?)\s*>?\s*(?:\n|$)/); if(nk&&tNick(nk[1])&&!/^거래/.test(nk[1])) f.nick=tNick(nk[1]);
  else {const ki=lines.findIndex(l=>/^구매자$/.test(l)); if(ki>=0&&lines[ki+1]) f.nick=tNick(lines[ki+1]);}
  if(!f.nick) delete f.nick;
  const me2=all.match(/거래\s*방법\s*[:]?\s*([^\n]+)/); if(me2&&!/^\s*$/.test(me2[1])) f.method=me2[1].trim();
  else {const mm=all.match(/(GS\s*반값\s*택배|CU\s*알뜰\s*택배|일반\s*택배\s*\(\s*(?:선불|착불)\s*\)|편의점\s*택배)/); if(mm) f.method=mm[1].replace(/\s+/g,'');}
  const it=lines.find(l=>/\[[^\]]+\]/.test(l)); if(it) f.item=it.replace(/^.*?(\[)/,'$1').replace(/\s*(\.{2,}|…|\.…)\s*$/,'').trim();
  // 금액
  f.price=tAmountAfter(all,/상품\s*금액\s*[:]?\s*([\d,]+)\s*원/);
  f.ship=tAmountAfter(all,/배송비\s*[:]?\s*\+?\s*([\d,]+)\s*원/);
  f.fee=tAmountAfter(all,/수수\s*료?\s*(?:ⓘ|\(i\)|i)?\s*[-−–]?\s*([\d,]+)\s*원/);
  f.payout=tAmountAfter(all,/입금\s*예정\s*금액\s*(?:ⓘ|\(i\)|i)?\s*[:]?\s*([\d,]+)\s*원/);
  const si=all.search(/판매\s*정보|상품\s*금액/);
  if(si>=0&&(!f.price||!f.payout||!f.ship||!f.fee)){ // 라벨과 숫자가 따로 읽힌 경우: 순서로 맞추기
    const seg=all.slice(si).split(/배송지\s*정보/)[0]; const am=[...seg.matchAll(/([+\-−–]?)\s*(\d{1,3}(?:,\d{3})+|\d+)\s*원/g)].map(m=>({s:m[1],v:tNum(m[2])}));
    const un=am.filter(a=>!a.s&&a.v>=1000);
    if(!f.price&&un[0]) f.price=un[0].v; if(!f.ship){const p=am.find(a=>a.s==='+');if(p)f.ship=p.v;} if(!f.fee){const p=am.find(a=>a.s&&a.s!=='+');if(p)f.fee=p.v;} if(!f.payout&&un.length>1) f.payout=un[un.length-1].v;
  }
  if(!f.price&&it){const ix=lines.indexOf(it);const nx=lines.slice(ix+1,ix+3).join(' ').match(/(\d{1,3}(?:,\d{3})+)\s*원/);if(nx)f.price=tNum(nx[1]);}
  if(f.price&&!f.payout&&f.ship&&f.fee) f.payout=f.price+f.ship-f.fee;
  // 배송지
  const bi=lines.findIndex(l=>/배송지\s*정보/.test(l));
  let end=lines.findIndex((l,i)=>i>bi&&/거래\s*요청|거래\s*정보|주문\s*번호|자주\s*묻는/.test(l)); if(end<0) end=lines.length;
  const reg=lines.slice(bi>=0?bi+1:0,end);
  const pi=reg.findIndex(l=>T_PHONE.test(l)&&!/·/.test(l));
  if(pi>=0&&(bi>=0||reg.some(l=>/\(\d{5}\)/.test(l))||reg.some(l=>T_CVS.test(l)))){
    const pm=reg[pi].match(T_PHONE); f.rPhone=tFmtPhone(pm[1]); if(pm[2]) f.safe=true;
    const zi=reg.findIndex(l=>/\(\d{5}\)/.test(l));
    const ci=reg.findIndex(l=>T_CVS.test(l));
    if(zi>=0&&(ci<0||zi<ci)){ f.zip=reg[zi].match(/\((\d{5})\)/)[1];
      const adl=[reg[zi].replace(/^.*?\(\d{5}\)\s*/,'')].concat(reg.slice(zi+1,pi>zi?pi:reg.length).filter(l=>!T_PHONE.test(l)));
      const [a,b]=tSplitAddr(tJoin(adl)); f.addr=a; f.addr2=b;
      const nm=reg[zi-1]; if(tIsName(nm)) f.rName=nm;
    } else if(ci>=0){ f.cvs=reg[ci].match(T_CVS)[1].replace(/\s+/g,''); const ca=tJoin(reg.slice(ci+1).filter(l=>!T_PHONE.test(l))); if(ca) f.cvsAddr=ca;
      const nm=reg[pi-1]; if(tIsName(nm)) f.rName=nm;
    } else { const nm=reg[pi-1]; if(tIsName(nm)) f.rName=nm; }
  }
  const rq=all.match(/거래\s*요청\s*사항\s*\n([^\n]+)/); if(rq&&!T_LABELS.test(rq[1])) f.memo=rq[1].trim();
  return [f];
}

/* 조각들을 거래로 합치기. order: 올린 순서. 반환 {added, updated, loose} */
function tMerge(trades,frags,mk){
  const res={added:0,updated:0,loose:0,touched:new Set()};
  const find=f=>{const d=tDigits(f.rPhone);
    return (f.orderNo&&trades.find(t=>t.orderNo===f.orderNo))
      ||(f.resvNo&&trades.find(t=>t.resvNo===f.resvNo||(t.resvAlt||[]).includes(f.resvNo)))
      ||(d.length>=10&&trades.find(t=>tDigits(t.rPhone)===d))
      ||(f.nick&&trades.find(t=>t.nick&&t.nick===f.nick))
      ||(f.rName&&(()=>{const c=trades.filter(t=>t.rName===f.rName);return c.length===1?c[0]:null;})())||null;};
  const keyed=f=>!!(f.orderNo||(f.resvNo&&tDigits(f.rPhone).length>=10)||f.nick||tDigits(f.rPhone).length>=10);
  const put=(t,f)=>{const before=JSON.stringify(t);
    if(f.orderAt&&(!t.orderAt||f.orderAt.length>t.orderAt.length))t.orderAt=f.orderAt;
    if(f.item)f.item=f.item.replace(/\s*(\.{2,}|…|\.…)\s*$/,'').trim();
    ['orderNo','nick','method','price','ship','fee','payout','rName','rPhone','zip','addr','addr2','cvs','cvsAddr','memo'].forEach(k=>{if(f[k]&&!t[k])t[k]=f[k];});
    if(f.safe) t.safe=true;
    if(f.item&&(!t.item||(f.itemFull&&!t.itemFull)||(!t.itemFull&&f.item.length>t.item.length))){t.item=f.item;if(f.itemFull)t.itemFull=true;}
    if(f.resvNo){ if(!t.resvNo){t.resvNo=f.resvNo;t.resvService=f.resvService||t.resvService;t.resvUntil=f.resvUntil||t.resvUntil;t.resvAt=f.resvAt||t.resvAt;}
      else if(t.resvNo!==f.resvNo){t.resvAlt=t.resvAlt||[];if(!t.resvAlt.includes(f.resvNo))t.resvAlt.push(f.resvNo);}
      else {if(f.resvUntil&&!t.resvUntil)t.resvUntil=f.resvUntil;if(f.resvAt&&!t.resvAt)t.resvAt=f.resvAt;}
      if(!t.status||t.status==='need')t.status='reserved';}
    if(f.listStatus==='reserved'&&(!t.status||t.status==='need'))t.status='reserved';
    if(f.listStatus==='need'&&!t.resvNo)t.status='need';
    if(f.raw){t.raw=t.raw||[];if(!t.raw.includes(f.raw)){t.raw.push(f.raw);if(t.raw.length>6)t.raw.shift();}}
    if(JSON.stringify(t)!==before)res.touched.add(t.id);};
  const rank={detail:0,list:1,resv:2};
  const idx=frags.map((f,i)=>({f,i})); const owner=new Array(frags.length).fill(null);
  idx.filter(x=>keyed(x.f)).sort((a,b)=>(rank[a.f.src]??3)-(rank[b.f.src]??3)||(a.f.orderNo?0:1)-(b.f.orderNo?0:1)||a.i-b.i).forEach(({f,i})=>{
    let t=find(f); if(!t){t=mk();trades.push(t);res.added++;} put(t,f); owner[i]=t;});
  idx.filter(x=>!keyed(x.f)).forEach(({f,i})=>{ // 열쇠 없는 조각: 앞(없으면 뒤) 캡처의 거래에 붙임
    if(!(f.price||f.rName||f.addr||f.cvs||f.item||f.memo||f.resvNo)) return;
    let t=find(f); if(!t){for(let k=i-1;k>=0;k--)if(owner[k]){t=owner[k];break;}}
    if(t&&f.resvNo&&t.resvNo&&t.resvNo!==f.resvNo&&!(t.resvAlt||[]).includes(f.resvNo)){t=mk();trades.push(t);res.added++;}
    else if(t&&!find(f)) t.guess=true; if(!t){for(let k=i+1;k<frags.length;k++)if(owner[k]){t=owner[k];break;}}
    if(!t){res.loose++;return;} put(t,f); owner[i]=t;});
  res.updated=[...res.touched].length;
  return res;
}
/* 거래 a를 b에 합치기 (b의 빈 칸만 채움) */
function tAbsorb(b,a){
  ['orderNo','orderAt','nick','method','item','price','ship','fee','payout','rName','rPhone','zip','addr','addr2','cvs','cvsAddr','memo','resvService','resvUntil','resvAt','tracking','note'].forEach(k=>{if(a[k]&&!b[k])b[k]=a[k];});
  if(a.safe)b.safe=true;
  [a.resvNo].concat(a.resvAlt||[]).filter(Boolean).forEach(x=>{if(!b.resvNo)b.resvNo=x;else if(x!==b.resvNo){b.resvAlt=b.resvAlt||[];if(!b.resvAlt.includes(x))b.resvAlt.push(x);}});
  b.raw=(b.raw||[]).concat(a.raw||[]).slice(-6);
  if(b.resvNo&&(!b.status||b.status==='need'))b.status='reserved';
  delete b.guess;
}

/* 대화 글에서 옵션(캐릭터) 이름과 개수 찾기. 상품 제목 줄([공구] …)은 뺌 */
function tExtractOpts(text,list){
  let ls=String(text||'').split('\n').filter(l=>!/\[[^\]]*\]|도시락|공구|\d{1,3},\d{3}\s*원/.test(l));
  const hasName=l=>list.some(o=>o.al.some(a=>l.includes(a)));
  const bul=ls.filter(l=>/^\s*[•·∙ㆍ*\-]/.test(l)&&hasName(l)); if(bul.length) ls=bul; /* "• 치이 1 하치 1" 같은 정리 줄이 있으면 그 줄만 */
  let src='\n'+ls.join('\n')+'\n';
  const found={},order=[];
  const all=[];list.forEach(o=>o.al.forEach(a=>all.push({a,o})));all.sort((x,y)=>y.a.length-x.a.length);
  all.forEach(({a,o})=>{const re=new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');let m;
    while((m=re.exec(src))){const after=src.slice(m.index+a.length,m.index+a.length+8).match(/^\s*(?:[xX×*]\s*)?(\d{1,2})\s*(?:개|ea|EA|마리)?/);
      const q=after?+after[1]:1; if(!(o.name in found)){found[o.name]=q;order.push({n:o.name,i:m.index});} else {found[o.name]=Math.max(found[o.name],q);const e=order.find(x=>x.n===o.name);if(m.index<e.i)e.i=m.index;}}
    src=src.replace(re,' '.repeat(a.length));});
  return order.sort((a,b)=>a.i-b.i).map(x=>({n:x.n,q:found[x.n]}));}
const tOptText=arr=>arr.map(x=>x.n+' '+x.q).join(' · ');

async function tReadImages(g,files){
  if(!canFetch()){toast('사진 글자 읽기는 사이트에 올린 뒤 구글 OCR로 동작합니다. 지금은 "글로 붙여 넣기"를 써 주세요');return;}
  if(!V.adminKey){toast('공구 설정 → 연동에 관리자 비밀번호를 먼저 넣어 주세요');return;}
  const list=Array.from(files||[]).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})||a.lastModified-b.lastModified);
  if(!list.length) return; const out=document.getElementById('tOut'); const texts=new Array(list.length).fill(''); let done=0, fail=0;
  const show=()=>{if(out)out.innerHTML=`<div class="band">사진 읽는 중… ${done}/${list.length}</div>`;}; show();
  let next=0; const worker=async()=>{while(next<list.length){const i=next++;try{const data=await shrink(list[i],2000,.9);const r=await fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:V.adminKey,ocr:data})});const j=await r.json();if(j&&j.text)texts[i]=j.text;else fail++;}catch(e){fail++;}done++;show();}};
  await Promise.all([worker(),worker(),worker()]);
  tApply(g,texts,fail?`${fail}장은 읽지 못했어요.`:'');
}
function tChatTrade(g,tx){const c=(g.trades||[]).filter(t=>t.nick&&tx.includes(t.nick)).sort((a,b)=>b.nick.length-a.nick.length);if(c.length)return c[0];const r=(g.trades||[]).filter(t=>t.rName&&t.rName.length>=2&&tx.includes(t.rName));return r.length===1?r[0]:null;}
function tApply(g,texts,extra){
  g.trades=g.trades||[]; const list=tOptList(g); const chats=[];
  const frags=[];texts.forEach(tx=>{if(!tx||!tx.trim())return;
    const isChat=/번개톡|메시지를?\s*입력|대화/.test(tx)&&!/주문\s*번호|예약\s*번호|상품\s*금액|\/\s*택배\s*거래/.test(tx);
    if(isChat){chats.push(tx);return;} frags.push(...tParse(tx,tMine()));});
  const r=tMerge(g.trades,frags,blankTrade);
  let oDone=0,oMiss=0; chats.forEach(tx=>{const t=tChatTrade(g,tx);const o=tExtractOpts(tx,list);if(t&&o.length){if(!t.option||t.optGuess){t.option=tOptText(o);t.optGuess=true;}oDone++;}else oMiss++;});
  if(chats.length) extra=[extra,`대화 ${chats.length}개 중 옵션 넣음 ${oDone}개${oMiss?` · 거래를 못 찾은 대화 ${oMiss}개 (카드의 "대화로 넣기"로 넣어 주세요)`:''}`].filter(Boolean).join(' · ');
  save();render();
  const out=document.getElementById('tOut');
  if(out) out.innerHTML=`<div class="band">${texts.length}개 읽음 → 새 거래 ${r.added}건, 정보 보탠 거래 ${Math.max(0,r.updated-r.added)}건${r.loose?` · 어디에도 못 붙인 조각 ${r.loose}개`:''}${extra?' · '+extra:''}</div>`;
  toast(frags.length?`새 거래 ${r.added}건 · 업데이트 ${Math.max(0,r.updated-r.added)}건`:`옵션 넣은 거래 ${oDone}건`);
}
function tEdit(g,t,isNew){
  const F=[['nick','구매자 닉네임'],['orderNo','주문번호'],['orderAt','주문 일시'],['method','거래방법 (구매자 선택)'],['item','상품명'],['price','상품금액','n'],['ship','배송비','n'],['fee','판매 수수료','n'],['payout','입금 예정 금액','n'],['rName','받는 분'],['rPhone','연락처'],['cvs','도착 편의점 (반값택배)'],['cvsAddr','편의점 주소'],['zip','우편번호'],['addr','주소'],['addr2','상세주소'],['memo','요청사항'],['resvService','예약 서비스'],['resvNo','예약번호'],['resvUntil','예약 유효기간 (예: 11월 18일 (수))'],['option','옵션 (보낼 캐릭터)'],['plan','발송 예정 (예: 다음주 수요일)'],['tracking','운송장 번호'],['note','내 메모']];
  const others=(g.trades||[]).filter(x=>x!==t);
  openModal(`<div class="row between"><h2 class="t" style="font-size:19px">${isNew?'거래 추가':'거래 수정'}</h2><button class="btn s" data-close>닫기</button></div>
    <div class="grid2" style="margin-top:8px">${F.map(([k,l,ty])=>`<label class="f">${esc(l)}<input data-tf="${k}" ${ty==='n'?'inputmode="numeric"':''} value="${esc(t[k]||(ty==='n'?'':''))}"></label>`).join('')}</div>
    <label class="sw" style="margin-top:8px"><input type="checkbox" id="tf_safe" ${t.safe?'checked':''}> 안심번호</label>
    ${(t.resvAlt||[]).length?`<label class="f" style="margin-top:8px">다른 예약번호 (쉼표로 구분)<input id="tf_alt" value="${esc((t.resvAlt||[]).join(', '))}"></label>`:''}
    ${others.length&&!isNew?`<div class="grp" style="margin-top:12px"><div class="grp-h">다른 거래와 합치기</div><p class="help">같은 거래가 두 장으로 나뉘었으면 고르세요. 이 거래의 내용이 고른 거래의 빈 칸으로 들어가고, 이 카드는 없어집니다.</p><div class="row" style="margin-top:6px"><select id="tf_into" style="flex:1"><option value="">합칠 거래 고르기</option>${others.map(o=>`<option value="${o.id}">${esc(o.nick||o.rName||o.resvNo||'(이름 없음)')} · ${esc(o.item?o.item.slice(0,18):'')}</option>`).join('')}</select><button class="btn s" id="tf_merge">합치기</button></div></div>`:''}
    <div class="row end" style="margin-top:12px"><button class="btn" data-close>취소</button><button class="btn p" id="tf_save">저장</button></div>`);
  const md=document.getElementById('modal');
  md.querySelector('#tf_save').onclick=()=>{md.querySelectorAll('[data-tf]').forEach(i=>{const k=i.dataset.tf;t[k]=['price','ship','fee','payout'].includes(k)?tNum(i.value):i.value.trim();});
    t.safe=md.querySelector('#tf_safe').checked; const alt=md.querySelector('#tf_alt'); if(alt)t.resvAlt=alt.value.split(',').map(x=>x.trim()).filter(Boolean);
    if(t.resvNo&&(t.status||'need')==='need')t.status='reserved'; delete t.guess;
    if(isNew&&!(g.trades||[]).includes(t))g.trades.push(t);
    md.hidden=true;save();render();toast('저장했어요');};
  const mg=md.querySelector('#tf_merge'); if(mg) mg.onclick=()=>{const id=md.querySelector('#tf_into').value;const b=(g.trades||[]).find(x=>x.id===id);if(!b){toast('합칠 거래를 골라 주세요');return;}tAbsorb(b,t);g.trades=g.trades.filter(x=>x!==t);md.hidden=true;save();render();toast('두 거래를 합쳤어요');};
}
function tOpt(g,t){
  const list=tOptList(g);
  openModal(`<div class="row between"><h2 class="t" style="font-size:20px">옵션 넣기 · ${esc(t.nick||t.rName||'')}</h2><button class="btn s" data-close>닫기</button></div>
    <p class="help" style="margin:6px 0 10px">번개톡 대화를 붙여 넣거나 대화 캡처를 올리면 캐릭터 이름과 개수를 찾아요. 아래 칸에서 확인하고 고친 뒤 저장하세요.</p>
    <textarea id="o_chat" rows="7" placeholder="예) 안녕하세요! 우사기 1개랑 하치와레 1개로 부탁드려요"></textarea>
    <label class="drop" style="margin-top:8px">대화 캡처로 읽기 (여러 장)<input type="file" id="o_img" accept="image/*" multiple></label>
    <label class="f" style="margin-top:12px">옵션 (보낼 캐릭터 · 개수)<input id="o_val" value="${esc(t.option||'')}" placeholder="예) 우사기 1 · 하치와레 1" style="font-size:18px;font-weight:700"></label>
    <p class="help" id="o_hint" style="margin-top:4px">찾는 이름: ${list.map(o=>esc(o.name)).join(', ')} · 목록은 설정에서 바꿀 수 있어요</p>
    <div class="row end" style="margin-top:12px"><button class="btn" data-close>취소</button><button class="btn p" id="o_save">저장</button></div>`);
  const md=document.getElementById('modal'), ta=md.querySelector('#o_chat'), val=md.querySelector('#o_val'), hint=md.querySelector('#o_hint');
  const run=()=>{const o=tExtractOpts(ta.value,list);if(o.length){val.value=tOptText(o);hint.textContent='대화에서 찾았어요: '+tOptText(o)+' — 다르면 고쳐 주세요';}else if(ta.value.trim()){hint.textContent='목록에 있는 이름을 못 찾았어요. 직접 적어 주세요.';}};
  ta.oninput=run;
  md.querySelector('#o_img').onchange=async e=>{const fs=Array.from(e.target.files||[]).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)return;
    if(!canFetch()){toast('사진 글자 읽기는 사이트에 올린 뒤 동작합니다. 대화를 복사해 붙여 넣어 주세요');return;}
    if(!V.adminKey){toast('폼 모집 공구 → 설정 → 연동에 관리자 비밀번호를 먼저 넣어 주세요');return;}
    hint.textContent='대화 캡처 읽는 중…';
    for(const f of fs){try{const data=await shrink(f,2000,.9);const r=await fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:V.adminKey,ocr:data})});const j=await r.json();if(j&&j.text)ta.value=(ta.value?ta.value+'\n':'')+j.text;}catch(err){}}
    run();};
  md.querySelector('#o_save').onclick=()=>{t.option=val.value.trim();delete t.optGuess;md.hidden=true;save();render();toast(t.option?'옵션 저장: '+t.option:'옵션을 비웠어요');};
}
function bindTrade(g){
  ['tAddBtn','tAddBtn2'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=()=>tOpenAdd(g);});
  const sb=document.getElementById('tSetBtn'); if(sb) sb.onclick=()=>tOpenSet(g);
  document.querySelectorAll('[data-topt]').forEach(b=>b.onclick=()=>{const t=g.trades.find(x=>x.id===b.dataset.topt);if(t)tOpt(g,t);});
  const ol=document.getElementById('tOptList'); if(ol) ol.onchange=()=>{g.optList=ol.value;save();toast('옵션 목록 저장');};
  g.trades=g.trades||[];
  const fi=document.getElementById('tOcr'); if(fi) fi.onchange=()=>tReadImages(g,fi.files);
  const tp=document.getElementById('tParse'); if(tp) tp.onclick=()=>{const v0=v('tText');if(!v0)return toast('글을 붙여 넣어 주세요');tApply(g,v0.split(/^\s*={3,}\s*$/m));};
  const ta=document.getElementById('tAdd'); if(ta) ta.onclick=()=>tEdit(g,blankTrade(),true);
  document.querySelectorAll('[data-tgo]').forEach(b=>b.onclick=()=>{const [id,st]=b.dataset.tgo.split(':');const t=g.trades.find(x=>x.id===id);if(!t)return;if(st==='sent'){t.status=st;save();render();copyText(tShipMsg(g,t),'보냄으로 옮겼어요 · 발송 문구 복사');return;}
    t.status=st;save();render();toast({reserved:'포장·발송 탭으로 옮겼어요',sent:'보냄으로 옮겼어요',done:'받음 확인'}[st]||'되돌렸어요');});
  document.querySelectorAll('[data-ttab]').forEach(b=>b.onclick=()=>{V.tTab=b.dataset.ttab;saveView();render();});
  document.querySelectorAll('[data-tpack]').forEach(c=>c.onchange=()=>{const t=g.trades.find(x=>x.id===c.dataset.tpack);if(t){t.packed=c.checked;save();render();}});
  document.querySelectorAll('[data-tpick]').forEach(b=>b.onclick=()=>{const [id,no]=b.dataset.tpick.split(':');const t=g.trades.find(x=>x.id===id);if(t){tPick(t,no);save();render();toast(no+' 로 보내요');}});
  
  document.querySelectorAll('[data-tstat]').forEach(s=>s.onchange=()=>{const t=g.trades.find(x=>x.id===s.dataset.tstat);if(t){t.status=s.value;save();render();}});
  document.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=()=>{const t=g.trades.find(x=>x.id===b.dataset.tedit);if(t)tEdit(g,t,false);});
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{if(b.dataset.armed){g.trades=g.trades.filter(x=>x.id!==b.dataset.tdel);save();render();}else{b.dataset.armed='1';b.textContent='정말 삭제?';}});
  const tt=document.getElementById('tTitle'); if(tt) tt.onchange=()=>{g.title=tt.value.trim()||g.title;save();render();};
  const tn=document.getElementById('tItemName'); if(tn) tn.onchange=()=>{g.itemName=tn.value.trim();save();render();toast('기본 물품명 저장');};
  const tm=document.getElementById('tMyPhone'); if(tm) tm.onchange=()=>{S.seller.myPhone=tm.value.trim();save();toast('내 연락처 저장');};
  const dg=document.getElementById('tDelG'); if(dg) dg.onclick=e=>{if(e.target.dataset.armed){S.groups=S.groups.filter(x=>x!==g);V.gid=S.groups[0]?.id;save();render();}else{e.target.dataset.armed='1';e.target.textContent='정말 삭제? (다시 누르기)';}};
}

function syncPush(){ if(!canFetch()||!V.adminKey||personal||formView) return; try{localStorage.setItem(DIRTY,String(Date.now()));}catch(e){} syncBadge('☁️ 저장 중…','busy'); clearTimeout(syncTimer); syncTimer=setTimeout(syncNow,250); }
function syncNow(){ if(syncBusy){syncAgain=true;return;} syncBusy=true; syncAgain=false;
  const done=(ok,msg)=>{ syncBusy=false; if(syncAgain){syncNow();return;} if(ok){ try{localStorage.removeItem(DIRTY);}catch(e){} syncBadge('✓ 시트에 저장됨','ok'); } else { syncBadge('⚠️ 저장 실패 · 다시 시도 중','bad'); toast('시트 저장 실패'+(msg?': '+msg:'')+' — 30초 뒤 다시 시도해요'); setTimeout(()=>{ if(localStorage.getItem(DIRTY)) syncNow(); },30000); } };
  try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:V.adminKey,state:Object.assign({},S,{groups:S.groups.filter(x=>!x.demo)})})}).then(r=>r.json()).then(j=>done(!(j&&j.error),j&&j.error)).catch(()=>done(false,'연결 끊김'));}catch(e){done(false);} }
window.addEventListener('beforeunload',e=>{ if(syncBusy||localStorage.getItem(DIRTY)&&syncTimer){ e.preventDefault(); e.returnValue=''; } });
function pushResponse(g,r){ try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({form:g.id,response:r})}).then(x=>x.json()).then(j=>{if(j&&j.closed&&j.error){g.form.open=false;g.form.responses=g.form.responses.filter(x=>x.id!==r.id);V.formDone=null;saveView();render();toast('방금 마감되어 신청이 접수되지 않았어요');}else if(j&&j.error)toast('신청 전달 실패: '+j.error);else if(j&&j.closed){g.form.open=false;render();}}).catch(()=>toast('전달 실패. 다시 시도해 주세요'));}catch(e){} }
async function refreshFormStatus(g){ if(!canFetch()) return; try{const r=await fetch(S.seller.syncUrl+'?form='+encodeURIComponent(g.id)); const j=await r.json(); if(j&&j.group&&j.group.form){const wasOpen=formOpen(g); g.form.open=!!j.group.form.open; g.form.responses=j.group.form.responses||g.form.responses; if(wasOpen!==formOpen(g)) render();}}catch(e){} }
setInterval(()=>{ if(formView){const g=S.groups.find(x=>x.id===formView); if(g&&formOpen(g)) refreshFormStatus(g);} },15000);
let wasWaiting=null; setInterval(()=>{ const g=G(); if(!g) return; const w=formWaiting(g); if(wasWaiting===true&&w===false) render(); wasWaiting=w; },5000);
function pushRefund(m){ if(!canFetch()){save();toast('저장했어요');return;} try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({member:m.id,refundBank:m.refundBank,refundAcct:m.refundAcct,refundHolder:m.refundHolder})}).then(r=>r.json()).then(j=>{if(j&&j.error)toast('전달 실패: '+j.error);else if(!j||!j.v)toast('전달은 됐지만 공구장 쪽 업데이트가 필요해요. 공구장에게 계좌를 직접 알려 주세요');else toast('환불 계좌가 전달됐어요');}).catch(()=>toast('전달 실패. 다시 시도해 주세요'));}catch(e){} }
/* 관리자: 시트에서 참여자가 직접 넣은 값(배송지·환불 계좌)만 가져와 합치기 — 다른 내 작업은 건드리지 않음 */
const SELF_F=['name','phone','zip','addr','addr2','memo','cvs','cvsAddr','delivery','selfAt'], RF_F=['refundBank','refundAcct','refundHolder','rfAt'];
async function pullSelfFields(manual){ if(!canFetch()||!V.adminKey) { if(manual) toast('구글 시트 연동이 필요해요'); return; }
  try{ const r=await fetch(S.seller.syncUrl+'?key='+encodeURIComponent(V.adminKey)); const j=await r.json(); if(!j||!j.groups){ if(manual) toast('불러오기 실패'); return; }
    let n=0; j.groups.forEach(rg=>{const lg=S.groups.find(x=>x.id===rg.id); if(!lg) return; (rg.members||[]).forEach(rm=>{const lm=lg.members.find(x=>x.id===rm.id); if(!lm) return;
      if((rm.selfAt||'')>(lm.selfAt||'')){SELF_F.forEach(k=>{if(rm[k]!==undefined)lm[k]=rm[k];});n++;}
      if((rm.rfAt||'')>(lm.rfAt||'')){RF_F.forEach(k=>{if(rm[k]!==undefined)lm[k]=rm[k];});n++;} });});
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); if(manual) toast(n?'새로 들어온 내용 '+n+'건을 불러왔어요':'새로 들어온 내용이 없어요');
  }catch(e){ if(manual) toast('불러오기 실패'); } }
function pushMember(m){ if(!canFetch()){save();return;} try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({member:m.id,name:m.name,phone:m.phone,zip:m.zip,addr:m.addr,addr2:m.addr2,memo:m.memo,delivery:m.delivery,cvs:m.cvs,cvsAddr:m.cvsAddr})}).then(r=>r.json()).then(j=>{if(j&&j.error)toast('전달 실패: '+j.error);else toast('배송지가 전달됐어요');}).catch(()=>toast('전달 실패. 다시 시도해 주세요'));}catch(e){} }
var LOADING=false, LOADFAIL=false;
const CK=()=>'gongu-cache-'+(formView?'f-'+formView:'p-'+personal);
function applyForm(j){ S.groups=[Object.assign(blankGroup(''),j.group,{members:[]})]; S.groups[0].form=Object.assign(blankForm(),j.group.form); V.gid=j.group.id; }
function applyMember(j){ S.seller=Object.assign(S.seller,j.seller||{}); S.notice=j.notice||S.notice; S.groups=[Object.assign(j.group,{members:[Object.assign(blankMember(),j.member)]})]; if(!j.group.stepsV2)migrateSteps(S.groups[0]); V.gid=j.group.id; V.mid=j.member.id; }
const BOOT=(async()=>{
  if(!canFetch()) return;
  try{
    if(formView||personal){
      /* 전에 열어본 적 있으면 저장해 둔 내용을 바로 보여주고, 최신 내용은 뒤에서 받아와 바꿔요 */
      let cached=null; try{cached=JSON.parse(localStorage.getItem(CK())||'null');}catch(e){}
      if(cached&&cached.group){ try{ formView?applyForm(cached):applyMember(cached); }catch(e){cached=null;} }
      if(!cached||!cached.group){ LOADING=true; render(); }
      else render();
      const r=await fetch(S.seller.syncUrl+(formView?'?form='+encodeURIComponent(formView):'?member='+encodeURIComponent(personal))); const j=await r.json();
      LOADING=false;
      if(j&&j.group&&(formView||j.member)){ formView?applyForm(j):applyMember(j); try{localStorage.setItem(CK(),JSON.stringify(j));}catch(e){} }
      else if(j&&(j.error||!j.group)){ try{localStorage.removeItem(CK());}catch(e){} if(cached&&cached.group){S.groups=[];} }
      render(); return;
    }
    const dAge=Date.now()-(+localStorage.getItem(DIRTY)||0); if(localStorage.getItem(DIRTY)&&dAge>=10*60*1000){ try{localStorage.removeItem(DIRTY);}catch(e){} }
    if(V.adminKey&&localStorage.getItem(DIRTY)&&dAge<10*60*1000){ toast('저장 안 끝난 변경사항을 시트에 올리고 있어요'); syncBadge('☁️ 저장 중…','busy'); syncNow(); return; }
    if(V.adminKey){ const r=await fetch(S.seller.syncUrl+'?key='+encodeURIComponent(V.adminKey)); const j=await r.json();
      if(j&&j.groups){ S=j; S.seller=Object.assign(baseState().seller,S.seller||{}); S.groups.forEach(g=>{migrateSteps(g);g.members=g.members.map(m=>Object.assign(blankMember(),m));}); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); toast('구글 시트에서 불러왔어요'); } else if(j&&j.error){ toast('시트 불러오기 실패: '+j.error); } }
  }catch(e){ if(LOADING){ LOADING=false; LOADFAIL=true; render(); } }
})();
BOOT.finally(()=>{ if(!personal&&!formView){ addDemoIfNeeded(); tryImportSeed(); } });
fetchRates();
window.addEventListener('hashchange',()=>{readHash();render();});
render();

/* 한 줄 맞춤: 넘치면 자간 → 글자 크기 순으로 줄여서 한 줄에 넣기. 너무 길면(70% 이하) 그때만 단어 단위로 줄바꿈 */
const FIT_SEL='.ck .lb,.ck .sb,.sts,.secsw>button,.chips>button,.receipt .shop,.receipt .date,.receipt .greet,.top .brand,.stage .hd b,.line>span:first-child:not(:has(.nm)),.line.item .q,.panel .card>h2,.ckbox b,.ckbox small';
function fitOne(el){
  const st=el.style; st.letterSpacing='';st.fontSize='';st.whiteSpace='nowrap';
  if(el.scrollWidth<=el.clientWidth+1) return;
  for(const ls of [-.02,-.04,-.06]){ st.letterSpacing=ls+'em'; if(el.scrollWidth<=el.clientWidth+1) return; }
  const base=parseFloat(getComputedStyle(el).fontSize), never=el.matches('.tabs>[role=tab],.secsw>button,.ck .lb,.ck .sb,.sts'), min=never?.5:.7;
  for(let k=.96;k>=min;k-=.03){ st.fontSize=(base*k).toFixed(2)+'px'; if(el.scrollWidth<=el.clientWidth+1) return; }
  if(never) return;
  st.fontSize='';st.letterSpacing='-.02em';st.whiteSpace='';
}
let fitRaf=0;
function fitTabs(t){ const bs=[...t.children]; bs.forEach(b=>{b.style.fontSize='';b.style.letterSpacing='';b.style.paddingLeft='';b.style.paddingRight='';});
  if(t.scrollWidth<=t.clientWidth+1) return; bs.forEach(b=>{b.style.paddingLeft='3px';b.style.paddingRight='3px';b.style.letterSpacing='-.03em';});
  const base=bs.map(b=>parseFloat(getComputedStyle(b).fontSize));
  for(let k=.97;k>=.5;k-=.03){ bs.forEach((b,i)=>b.style.fontSize=(base[i]*k).toFixed(2)+'px'); if(t.scrollWidth<=t.clientWidth+1) return; } }
function fitAll(){ cancelAnimationFrame(fitRaf); fitRaf=requestAnimationFrame(()=>{ document.querySelectorAll('.tabs,.subtabs').forEach(t=>{ if(t.offsetParent!==null) fitTabs(t); }); document.querySelectorAll(FIT_SEL).forEach(el=>{ if(el.offsetParent!==null) fitOne(el); }); }); }
new MutationObserver(fitAll).observe(document.body,{childList:true,subtree:true});
window.addEventListener('resize',fitAll);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
/* 손글씨 폰트가 늦게 받아지면 글자 폭이 바뀌니 그때 다시 맞추기 */
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',fitAll);
[300,1000,2500,5000].forEach(t=>setTimeout(fitAll,t));
document.addEventListener('click',()=>setTimeout(fitAll,30),true);

/* 두 손가락 확대·더블탭 확대 막기 */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1||(e.scale&&e.scale!==1)) e.preventDefault(); },{passive:false});
</script>
