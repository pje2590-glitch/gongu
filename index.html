<html lang="ko">
<head>
<meta charset="utf-8">

<title>직구 공구 정산서</title>
<meta property="og:title" content="직구 공구 정산서">

<meta name="robots" content="noindex">
<style>html{color-scheme:light dark}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>직구 공구 정산서</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Gothic:wght@400;700&family=Gothic+A1:wght@400;700&family=Sunflower:wght@500;700&family=Jua&family=Do+Hyeon&family=Gaegu:wght@400;700&family=Black+Han+Sans&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* Layout: 공구 칩 → PC는 [내 화면 | 참여자 화면] 두 칸, 폰은 토글. 각 칸은 탭. 색은 민트 바탕·흰 카드·초록(확인/강조)·빨강(조치 필요)·네이비(운송장) 넷만 */
:root{
  --bg:#E3EDED; --card:#FFFFFF; --ink:#22303A; --muted:#7F8B92; --line:#E2EAEA; --soft:#EEF2F2;
  --ok:#3E8E1E; --ok-bg:#EEF8E3; --ok-strong:#5DB32A;
  --bad:#C9413E; --bad-bg:#FBEAEA;
  --navy:#1C2531; --navy-ink:#FFFFFF;
  --cvs-bg:#FFF4CC; --cvs:#8A6300; --visit-bg:#E2EEFA; --visit:#2F5F9E;
  --body:"Gowun Dodum",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --title:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151D1D; --card:#1F2929; --ink:#ECF2F1; --muted:#95A2A2; --line:#2E3B3B; --soft:#283232;
  --ok:#9ADB70; --ok-bg:#243A18; --ok-strong:#7CCB4A; --bad:#F09490; --bad-bg:#3D2424; --navy:#0E151C; --navy-ink:#F4F7FA; --cvs-bg:#3D3415; --cvs:#F2D479; --visit-bg:#1E2F44; --visit:#9CC4F0; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151D1D; --card:#1F2929; --ink:#ECF2F1; --muted:#95A2A2; --line:#2E3B3B; --soft:#283232;
  --ok:#9ADB70; --ok-bg:#243A18; --ok-strong:#7CCB4A; --bad:#F09490; --bad-bg:#3D2424; --navy:#0E151C; --navy-ink:#F4F7FA; --cvs-bg:#3D3415; --cvs:#F2D479; --visit-bg:#1E2F44; --visit:#9CC4F0; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:8px 11px;width:100%;min-width:0}
input[type=date],input[type=datetime-local],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;max-width:100%;box-sizing:border-box;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ok-strong);outline-offset:1px}
textarea{resize:vertical}
.num{font-variant-numeric:tabular-nums}
a{color:var(--ok)}
.t{font-family:var(--title);font-weight:400}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--title);font-size:26px;line-height:1.1;color:var(--ink)}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--soft);border-radius:6px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:6px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:6px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips .add{color:var(--ok);border-style:dashed}
.chips .past{width:100%;padding:6px 0 0;border-top:1px dashed var(--line);margin-top:2px}
.chips .past button{color:var(--muted);font-weight:400}

.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{display:none;font-size:13px;font-weight:700;background:var(--ink);color:var(--card);border-radius:6px;padding:5px 14px;width:max-content}
.eyebrow.light{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* 참여자 화면: 폰 기준 콤팩트 */
.mv{gap:8px}
.mv .card{padding:12px 14px;border-radius:12px}
.mv .card h2{font-size:17px;margin-bottom:6px}
.mv .receipt{padding:14px 14px 22px;border-radius:12px}
.mv .receipt .shop{font-size:22px}
.mv .receipt .date{font-size:12px;margin-bottom:6px}
.mv .receipt .greet{font-size:13px;padding-bottom:12px;margin-bottom:14px}
.mv .stage .hd b{font-size:15px}
.mv .line{font-size:15px;padding:5px 0}
.mv .line.total{font-size:14px;margin-top:10px;padding-top:10px}
.mv .grand{padding:14px 14px;margin-top:14px;font-size:16px}
.mv .grand span:last-child{font-size:24px}
.mv .acctbox{padding:12px 14px;gap:8px;margin-top:30px}
.mv .acct .n{font-size:18px}
.mv .notice{font-size:12px;margin-top:26px;padding-top:14px;line-height:1.6}
.mv .checks{gap:4px}
.mv .ck{padding:6px 4px;border-radius:5px}
.mv .ck .mark{font-size:18px}
.mv .ck .lb{font-size:12px}
.mv .ck .sb{font-size:10px}
.mv .tabs button{font-size:15px;padding:6px 4px 5px}
.mv .btn{padding:6px 10px;font-size:13px}
.mv .band{padding:8px;font-size:13px}
.mv .pill{font-size:12px;padding:2px 8px}
.mv .help{font-size:12px}
.mv .help.keep{margin-top:-2px}
.mv .dark{padding:12px 14px}
.mv .dark .tn{font-size:18px}
.mv .tl li{font-size:13px;padding-bottom:10px}
@media (max-width:959px){.formprev{display:none!important}}
.phone{border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--bg);max-width:400px}
.est{border:1.5px dashed var(--ok-strong)}
.invite{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.inv-frame{border:1.5px dashed var(--ok-strong);border-radius:8px;padding:22px 18px;text-align:center;background:var(--ok-bg)}
.inv-body{position:relative}
.inv-swans,.inv-script{display:none}
.inv-mark{font-size:44px;line-height:1;margin-bottom:10px}
.inv-title{font-family:var(--title);font-size:21px;line-height:1.3;text-wrap:balance;margin:0 0 10px}
.inv-text{white-space:pre-line;font-size:14px;line-height:1.75}
.inv-meta{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;line-height:1.8;color:var(--muted)}
.notice-card .nl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.5}
.notice-card .nl:last-of-type{border-bottom:0}
.notice-card .nl .ic{flex:0 0 22px;font-size:16px}
.notice-card .nl b{display:block;margin-bottom:2px}
.notice-card ul.plain{margin:0;padding-left:16px}
.notice-card ul.rules{margin:10px 0 0;padding:10px 12px 10px 30px;background:var(--soft);border-radius:8px;font-size:13px;line-height:1.55}
.notice-card ul.rules li{margin:3px 0}
.notice-card ul.rules li::marker{content:'✔️ '}
@media (min-width:960px){.cols{grid-template-columns:1fr 430px}.cols.single{grid-template-columns:1fr;max-width:600px;margin:0 auto;width:100%}.eyebrow{display:block}.seg{display:none}.col[hidden]{display:flex!important}.col.formhide{display:none!important}}

.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:8px 5px 7px;font-family:var(--title);font-size:16px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ok-strong)}
.tabs button .n{font-family:var(--body);font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:middle}

/* 공책 라벨 탭 */
.subtabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 14px;margin-bottom:-12px;position:relative;z-index:2;align-items:flex-end}
.subtabs button{border:1px solid var(--line);border-bottom:0;background:var(--soft);color:var(--muted);padding:6px 7px 7px;border-radius:9px 9px 0 0;font-size:12px;font-weight:700;position:relative;top:0;align-self:flex-end;white-space:nowrap}
@media (max-width:380px){.subtabs button{padding:6px 5px 7px;font-size:11.5px}.subtabs .n{padding:0 4px;margin-left:2px}}
.subtabs button.yellow{background:var(--cvs-bg);color:var(--cvs)} .subtabs button.red{background:var(--bad-bg);color:var(--bad)} .subtabs button.blue{background:var(--visit-bg);color:var(--visit)}
.subtabs button.blue[aria-selected="true"]{background:var(--visit-bg);color:var(--visit);border-color:var(--visit-bg)}
.subpanel.yellow>.card:first-child{background:var(--cvs-bg)} .subpanel.red>.card:first-child{background:var(--bad-bg);border-color:var(--bad)}
.subpanel.yellow>.card:first-child .tile,.subpanel.yellow>.card:first-child .pill:not(.ok):not(.no),.subpanel.red>.card:first-child .tile,.subpanel.yellow>.card:first-child .prow,.subpanel.yellow>.card:first-child .match,.subpanel.yellow>.card:first-child .sec,.subpanel.yellow>.card:first-child pre.msg,.subpanel.red>.card:first-child .prow{background:var(--card)}
.subtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);border-color:var(--line);z-index:3;padding-bottom:10px;margin-bottom:-3px}
.subtabs button.yellow[aria-selected="true"]{background:var(--cvs-bg);color:var(--cvs)} .subtabs button.red[aria-selected="true"]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.subtabs .n{font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:0 6px;margin-left:4px}
.subpanel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{font-family:var(--title);font-size:20px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px dashed var(--ok-strong)}
.sec{font-weight:700;font-size:14px;margin:16px 0 6px;padding:6px 10px;background:var(--soft);border-radius:6px}
.grp{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px 12px;margin-top:12px;background:var(--card)}
.grp:first-of-type{margin-top:0}
.grp-h{font-weight:700;font-size:14px;margin:-10px -12px 10px;padding:7px 12px;background:var(--soft);border-radius:10px 10px 0 0;border-bottom:1.5px dashed var(--line)}
.grp.visit{background:var(--visit-bg);border-color:var(--visit)} .grp.visit .grp-h{background:rgba(255,255,255,.6);border-color:var(--visit)}
.grp.cvs{background:var(--cvs-bg);border-color:var(--cvs)} .grp.cvs .grp-h{background:rgba(255,255,255,.6);border-color:var(--cvs)}
.grp.visit .prow,.grp.cvs .prow{background:var(--card)}
.subpanel.yellow>.card:first-child .grp{background:var(--card)}
.sec:first-child{margin-top:0}
.row.hd2{border-bottom:1px dashed var(--ok-strong);padding-bottom:8px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:700;line-height:1.4;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.no{background:var(--bad-bg);color:var(--bad)}

.receipt{background:var(--card);border-radius:12px;padding:22px 22px 28px;
  -webkit-mask:radial-gradient(circle at 10px 100%,transparent 6px,#000 6.5px) -10px 0/20px 100% repeat-x;mask:radial-gradient(circle at 10px 100%,transparent 6px,#000 6.5px) -10px 0/20px 100% repeat-x}
.receipt .shop{text-align:center;font-family:var(--title);color:var(--ok);font-size:26px}
.receipt .date{text-align:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.receipt .greet{text-align:center;font-size:14px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.stage .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.stage .hd b{font-family:var(--title);font-size:17px;font-weight:400}
.line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:5px 0}
.line.item{align-items:flex-start;padding:7px 0}
.line.item>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.line.item .nm{font-weight:700;font-size:15px;line-height:1.3}
.line.item .q{margin-left:0;font-size:12px}
.line.item .num{font-weight:700;font-size:16px;white-space:nowrap;line-height:1.3}
.line .q{color:var(--muted);margin-left:6px;font-size:12px}
.line.total{font-weight:700;font-size:15px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.line.sub{color:var(--muted);font-size:13px;font-weight:400}
.grand{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:18px 16px;background:var(--soft);border:2px solid var(--line);border-radius:10px;font-size:17px;font-weight:700}
.grand span:last-child{font-size:28px;letter-spacing:-.5px}
.grand.due{border-color:var(--bad);background:var(--bad-bg)} .grand.due span:last-child{color:var(--bad)}
.grand.paid{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)} .grand.paid span:last-child{color:var(--ok);font-size:22px}
.notice{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line);color:var(--muted);font-size:13px;white-space:pre-line;line-height:1.7}
.closed{color:var(--muted);font-size:13px;padding:6px 0}
#pcLayer{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
#pcLayer[hidden]{display:none}
.pcbox{background:var(--card);width:100%;max-width:560px;border-radius:12px 12px 0 0;overflow:hidden}
#pcHost{height:min(70vh,520px);background:#fff}
@media (min-width:700px){#pcLayer{align-items:center}.pcbox{border-radius:12px}}
.acctbox{margin-top:30px;padding:14px 16px;border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;gap:8px}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acct .n{font-size:21px;font-weight:700;letter-spacing:.3px}
.copy{border:0;background:transparent;color:var(--muted);padding:8px;border-radius:5px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.copy:hover{background:var(--soft)} .copy svg{width:18px;height:18px}
.band{background:var(--ok-bg);color:var(--ok);text-align:center;font-weight:700;border-radius:6px;padding:11px;font-size:14px}
.band.bad{background:var(--bad-bg);color:var(--bad)}
.dark{background:var(--navy);color:var(--navy-ink);border-radius:9px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.dark .ic{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 auto}
.dark small{opacity:.7;font-size:12px;display:block}
.dark .tn{font-size:21px;font-weight:700;letter-spacing:.4px}
.dark a{color:var(--navy-ink);font-size:13px;text-decoration:none;display:inline-block;margin-top:2px;opacity:.9}
.dark .tstat{font-size:14px;font-weight:700;margin-top:4px}
.dark .copy{color:var(--navy-ink);margin-left:auto}

.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ck{border-radius:6px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--soft)}
.ck .mark{font-size:22px;line-height:1.2}
.ck .lb{font-size:13px;font-weight:700}
.ck .sb{font-size:11px;color:var(--muted)}
.ck.ok{background:var(--ok-bg)} .ck.ok .lb{color:var(--ok)} .ck.no{background:var(--bad-bg)} .ck.no .lb{color:var(--bad)}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px 1fr auto;gap:0 10px;align-items:start;font-size:14px;padding:0 0 14px;position:relative}
.tl li::before{content:"";position:absolute;left:7px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--ok-strong);margin:5px 3px 0;box-sizing:border-box}
.tl li.now .dot{box-shadow:0 0 0 3px var(--ok-bg)} .tl li.done .dot{opacity:.45}
.tl li.now .t2{font-weight:700;color:var(--ok)}
.tl .at{color:var(--muted);font-size:12px;white-space:nowrap}
.tl .memo{grid-column:2/4;color:var(--muted);font-size:13px}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:700;font-size:14px}
.btn.p{background:var(--ok-strong);border-color:var(--ok-strong);color:#fff}
.btn.s{padding:5px 10px;font-size:13px;border-radius:5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.sw input{width:auto;flex:0 0 auto;margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--soft);border-radius:6px;padding:10px 12px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-size:17px;white-space:nowrap}
.tile.good b{color:var(--ok)} .tile.bad b{color:var(--bad)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
.prow .nm{font-weight:700;font-size:15px}
.prow .sm{font-size:13px;color:var(--muted);grid-column:1/3;word-break:break-word}
.prow .amt{text-align:right;font-weight:700}
.prow .tools{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prow .tools input:not([type=checkbox]),.prow .tools select{width:auto;flex:1 1 120px;padding:5px 9px;font-size:14px;border-radius:4px}
.prow .tools .lbl{font-size:12px;color:var(--muted)}
.prow .tools label.f{flex:1 1 120px}
.prow .tools label.f input,.prow .tools label.f select{flex:0 0 auto;width:100%}
.prow.packed{opacity:.5}
.prow.visit{background:var(--visit-bg);border-color:var(--visit-bg)} .prow.cvs{background:var(--cvs-bg);border-color:var(--cvs-bg)}
.card.visitcard{background:var(--visit-bg);border-color:var(--visit-bg)} .card.visitcard .grp,.card.cvscard .grp{background:var(--card)} .card.cvscard{background:var(--cvs-bg);border-color:var(--cvs-bg)}
.card.visitcard .prow,.card.cvscard .prow{background:var(--card)}
.card.visitcard .prow.alert,.card.cvscard .prow.alert{background:var(--bad-bg)}
.card.visitcard .sec,.card.cvscard .sec{background:rgba(255,255,255,.7)}
.pill.visit{background:var(--visit-bg);color:var(--visit)} .pill.cvs{background:var(--cvs-bg);color:var(--cvs)}
.prow.alert{border-color:var(--bad);background:var(--bad-bg)}
.pr{gap:6px 10px;padding:10px 12px}
.pr .pr-l1{display:grid;grid-template-columns:1fr 86px auto;gap:6px;align-items:end}
.pr .nmi{font-weight:700;font-size:15px;padding:7px 9px}
.pr .krw{font-size:14px;font-weight:700;color:var(--ok-strong);padding-bottom:9px;white-space:nowrap}
.pr .pr-l2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pr .pr-l2 label.f:nth-child(3):last-child{grid-column:3}
.pr label.f{font-size:11px;gap:2px}
.pr label.f input{padding:6px 8px;font-size:14px}
.pr .pr-fee{margin-top:6px;gap:5px}
.pr .pr-fee .btn.s{padding:3px 8px;font-size:12px}
.pr .pr-l3{margin-top:6px;align-items:flex-start;flex-wrap:wrap}
.pr .more{flex:1;text-align:right} .pr .more[open]{flex:1 1 100%}
.pr .pr-fee input{width:64px!important;padding:3px 6px!important;font-size:13px}
.pr .more summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none;display:inline-block}
.pr .more summary::after{content:' ▾'} .pr .more[open] summary::after{content:' ▴'}
.pr .more>div{text-align:left}
@media (max-width:400px){.pr .pr-l1{grid-template-columns:1fr 80px}.pr .krw{grid-column:1/3;padding:0;text-align:right}.pr .pr-l1 label.f:nth-child(3){grid-column:1/3}}
.prow.c{padding:8px 10px;gap:2px 8px}
.prow.c .nm{font-size:14px}
.prow.c .amt{font-size:14px}
.prow.c .sm{font-size:12px}
.prow.c .sm.it{color:var(--ink)}
.prow.c .sm.it b{font-weight:700}
.prow.c .tools{margin-top:4px;gap:4px}
.prow.c .pill{font-size:11px;padding:2px 7px}
.sts{display:flex;gap:4px;flex-wrap:wrap}
.st{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:700}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.no{background:var(--bad-bg);color:var(--bad)}
.prow.c .btn.s{padding:3px 8px;font-size:12px}
.pack{list-style:none;margin:2px 0 0;padding:0;grid-column:1/3;display:flex;flex-direction:column;gap:3px}
.pack li{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:5px 9px;background:var(--soft);border-radius:4px}
.pack li .qty{font-weight:700;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl td.w{white-space:normal;min-width:140px}
.tbl th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;scrollbar-width:thin}
pre.msg{background:var(--soft);border-radius:6px;padding:12px;font:inherit;font-size:14px;white-space:pre-wrap;margin:0;line-height:1.55}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:6px;font-size:14px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.help{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
.help b{color:var(--ink)}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.steps button.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bg)}
.steps button.now{background:var(--ok-strong);color:#fff;border-color:var(--ok-strong)}
.items{display:flex;flex-direction:column;gap:6px}
.items .it{display:grid;grid-template-columns:1fr 48px 74px 82px 70px 28px;gap:4px}
@media (max-width:420px){.items .it{grid-template-columns:1fr 40px 62px 72px 62px 26px}}
.catgrp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.catgrp summary{font-weight:700;font-size:15px;cursor:pointer}
.catgrp .pcard{border-color:var(--line)}
.kindsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kindbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:inherit;color:inherit}
.kindbtn b{font-size:15px}.kindbtn span{font-size:12px;color:var(--muted);line-height:1.35}
.kindbtn .kcount{color:var(--ok);font-weight:700}.kindbtn .kcount:empty{display:none}
.kindbtn.on{border-color:var(--ok);background:var(--soft)}
@media (max-width:400px){.kindsel{grid-template-columns:1fr}}
.items .it input{padding:5px 8px;font-size:14px}
.x{border:0;background:var(--soft);border-radius:4px;color:var(--muted)}
.muted{color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos figure{margin:0;position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.photos button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;width:24px;height:24px;font-size:14px}
.photos figcaption{font-size:11px;color:var(--muted);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{border:1px dashed var(--line);border-radius:7px;padding:14px;text-align:center;color:var(--muted);font-size:13px;display:block;cursor:pointer}
.drop input{display:none}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.72);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--card);border-radius:9px;max-width:620px;width:100%;padding:16px 18px}
.modal .pic{margin:10px 0 0} .modal .pic img{width:100%;border-radius:6px;display:block;border:1px solid var(--line)} .modal .pic figcaption{font-size:12px;color:var(--muted);padding:4px 2px}
.match{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.fontprev{display:flex;flex-direction:column;gap:6px}
.fontprev button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px;text-align:left;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fontprev button[aria-pressed="true"]{border-color:var(--ok-strong);background:var(--ok-bg)}
.fontprev small{color:var(--muted);font-family:var(--body);font-size:12px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-word}
</style>

const CRC_T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^-1)>>>0;}
function b64ToU8(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function strU8(s){return new TextEncoder().encode(s);}
function xmlEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function zipStored(entries){ // entries: [{name, data:Uint8Array}]
  const parts=[],cd=[];let off=0;
  const le16=n=>[n&255,(n>>8)&255], le32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const e of entries){
    const name=strU8(e.name), crc=crc32(e.data), sz=e.data.length;
    const lh=new Uint8Array([...le32(0x04034b50),...le16(20),...le16(0x800),...le16(0),...le16(0),...le16(0x21),...le32(crc),...le32(sz),...le32(sz),...le16(name.length),...le16(0)]);
    parts.push(lh,name,e.data);
    cd.push(new Uint8Array([...le32(0x02014b50),...le16(20),...le16(20),...le16(0x800),...le16(0),...le16(0),...le16(0x21),...le32(crc),...le32(sz),...le32(sz),...le16(name.length),...le16(0),...le16(0),...le16(0),...le16(0),...le32(0),...le32(off)]),name);
    off+=lh.length+name.length+sz;
  }
  const cdStart=off; let cdLen=0; cd.forEach(x=>cdLen+=x.length);
  const eocd=new Uint8Array([...le32(0x06054b50),...le16(0),...le16(0),...le16(entries.length),...le16(entries.length),...le32(cdLen),...le32(cdStart),...le16(0)]);
  const all=[...parts,...cd,eocd]; let total=0; all.forEach(x=>total+=x.length);
  const out=new Uint8Array(total); let p=0; for(const x of all){out.set(x,p);p+=x.length;}
  return out;
}

rId1"/></worksheet>`;
  const entries=Object.keys(LOGI_FILES).map(n=>({name:n,data:b64ToU8(LOGI_FILES[n])}));
  entries.push({name:'xl/worksheets/sheet1.xml',data:strU8(sheet)});
  return zipStored(entries);
}

/* 브라우저에서 xlsx(zip) 읽기 — 라이브러리 없이. 반환: {rowNum:{A:'값',B:'값'}} */
async function readXlsxRows(file){
  const buf=new Uint8Array(await file.arrayBuffer()); const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1; for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0) throw new Error('엑셀(xlsx) 파일이 아니에요');
  const n=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
  const files={}; let p=cdOff; const td=new TextDecoder();
  for(let k=0;k<n;k++){const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files[td.decode(buf.subarray(p+46,p+46+nl))]={method,csz,lho}; p+=46+nl+el+cl;}
  async function get(name){const f=files[name]; if(!f) return null; const nl=dv.getUint16(f.lho+26,true),el=dv.getUint16(f.lho+28,true); const start=f.lho+30+nl+el; const data=buf.slice(start,start+f.csz);
    if(f.method===0) return td.decode(data);
    const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return await new Response(stream).text();}
  const unesc=s=>String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
  const sst=[]; const ss=await get('xl/sharedStrings.xml'); if(ss){for(const m of ss.matchAll(/<si>([\s\S]*?)<\/si>/g)){sst.push([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));}}
  const names=Object.keys(files); const sheetName=names.find(x=>x==='xl/worksheets/sheet1.xml')||names.find(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x));
  if(!sheetName) throw new Error('시트를 찾을 수 없어요');
  const xml=await get(sheetName); const rows={};
  for(const m of xml.matchAll(/<c r="([A-Z]+)(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const col=m[1],r=+m[2],attrs=m[3],inner=m[4]||''; let val='';
    const t=(attrs.match(/\bt="(\w+)"/)||[])[1]; const v=(inner.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
    if(t==='s') val=sst[+v]||''; else if(t==='inlineStr'||t==='str'&&!v) val=[...inner.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''); else val=v??'';
    (rows[r]=rows[r]||{})[col]=unesc(val).trim();}
  return rows;
}
/* 로지아이 예약현황: 헤더에서 열 찾기 → [{name,phone,addr,tracking}] */
async function readLogiStatus(file){
  const rows=await readXlsxRows(file); const nums=Object.keys(rows).map(Number).sort((a,b)=>a-b); if(!nums.length) return [];
  let hdrRow=nums.find(r=>Object.values(rows[r]).some(v=>/운송장/.test(v)))||nums[0]; const hdr=rows[hdrRow];
  const colOf=re=>Object.keys(hdr).find(c=>re.test(hdr[c].replace(/\s/g,'')));
  const cT=colOf(/운송장/), cN=colOf(/받는분성함|받는분이름|수령인|받는사람/), cP=colOf(/받는분연락처|받는분전화|받는분휴대/), cA=colOf(/받는분주소/);
  if(!cT||!cN) throw new Error('운송장번호·받는분성함 열을 찾지 못했어요');
  return nums.filter(r=>r>hdrRow).map(r=>({name:rows[r][cN]||'',phone:cP?rows[r][cP]||'':'',addr:cA?rows[r][cA]||'':'',tracking:String(rows[r][cT]||'').replace(/\.0$/,'')})).filter(x=>x.tracking&&x.name);
}

}

function splitCarts(prods,qtyOf,usable){
  /* 단가 큰 것부터, 들어가는 첫 장바구니에 넣기 */
  const units=[]; prods.forEach(p=>{const q=qtyOf(p);for(let i=0;i<q;i++)units.push(p);}); units.sort((x,y)=>y.fx-x.fx);
  const carts=[]; const over=[];
  units.forEach(p=>{ if(p.fx>usable){over.push(p);return;} let c=carts.find(c=>c.sum+p.fx<=usable+1e-9); if(!c){c={sum:0,items:{}};carts.push(c);} c.sum+=p.fx; c.items[p.id]=(c.items[p.id]||0)+1; });
  return {carts,over};
}

function groupMessage(g){
  const head=`[${g.title} 공구] 💌\n상황 공유드립니다 :)`;
  if(g.step<0) return `${head}\n🧸 현재 : 1차 입금 확인 중 (${g.members.filter(paid1).length}/${g.members.length}명)\n✈️ 다음 단계 : 입금이 모이면 바로 주문할게요!\n오늘도 행복 가득 하루 되세요 ! 🌷💛`;
  const s=STEPS[g.step], h=g.history.find(x=>x.step===g.step), nx=STEPS[g.step+1];
  return `${head}\n🧸 현재 : ${s.t}${h&&h.memo?` (${h.memo})`:''}\n✈️ 다음 단계 : ${nx?nx.t:'끝! 모두 받으셨는지 확인해 주세요'}${s.k==='ship'?'\n📦 운송장 번호는 각자 정산서 링크에서 확인할 수 있어요':''}\n오늘도 행복 가득 하루 되세요 ! 🌷💛`;
}

function parseProductText(txt){
  const lines=String(txt||'').split(/\r?\n/).map(x=>x.replace(/[|·•\t]+/g,' ').trim()).filter(Boolean); const out=[]; let cat='';
  for(const ln of lines){
    const limitM=ln.match(/(?:1인|한\s*사람|한\s*분|お一人様?|各|1名)\s*(?:당|)?\s*(\d+)\s*(?:개|点|つ|個)?|(\d+)\s*(?:개|点|個)\s*(?:제한|限定|까지|まで)/);
    let rest=limitM?ln.replace(limitM[0],' '):ln;
    const priceM=rest.match(/(?:¥|￥|円|엔|\$|€)?\s*(\d{1,3}(?:,\d{3})+|\d{3,7})\s*(?:円|엔|원|JPY|yen)?/i);
    if(!priceM){ if(ln.length<=20) cat=ln.replace(/[\[\]【】<>#*]/g,'').trim(); continue; }
    const name=rest.replace(priceM[0],' ').replace(/[¥￥円엔원:：\-–—()（）]/g,' ').replace(/\b(JPY|yen)\b/ig,' ').replace(/\s+/g,' ').trim();
    if(!name) continue;
    out.push({name,fx:+priceM[1].replace(/,/g,''),maxPer:limitM?+(limitM[1]||limitM[2])||1:1,cat});
  }
  return out;
}

function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=url;});}

      box.querySelectorAll('.it input').forEach(i=>{const it=m.items[+i.dataset.k];if(i.dataset.f==='n')it.n=i.value.trim();else it[i.dataset.f]=+i.value||0;});m.items.forEach(it=>{if(it.fx)it.p=Math.round(it.fx*g.rate);});};
    box.querySelectorAll('.it input').forEach(i=>i.onchange=()=>{pull();draw();});
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{pull();m.items.splice(+b.dataset.rm,1);draw();});
    box.querySelector('#e_add').onclick=()=>{pull();m.items.push({n:'',q:1,p:0,fx:0,fee:0});draw();};
    box.querySelector('#e_cancel').onclick=()=>{if(isNew&&!m.name){g.members=g.members.filter(x=>x!==m);save();}render();};
    box.querySelector('#e_save').onclick=()=>{pull();if(!m.name){toast('이름을 입력해 주세요');return;}m.items=m.items.filter(i=>i.n);if(!m.items.length)m.items=[{n:'(상품 미정)',q:1,p:0,fx:0,fee:0}];distribute(g);save();render();toast('저장했어요');};
  };
  draw();row.after(box);box.querySelector('#e_name').focus();
}

/* 구글 시트 연동: 관리자는 비밀번호로 전체 저장·불러오기, 참여자는 자기 아이디로 자기 것만 */
if(MIGRATED){setTimeout(()=>{try{save();}catch(e){}},800);}
const canFetch=()=>!!(S.seller&&S.seller.syncUrl)&&!(window.claude&&window.claude.use);
let syncTimer=null;
function syncPush(){ if(!canFetch()||!V.adminKey||personal) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>{try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:V.adminKey,state:S})}).then(r=>r.json()).then(j=>{if(j&&j.error)toast('시트 저장 실패: '+j.error);}).catch(()=>{});}catch(e){}},800); }
function pushResponse(g,r){ try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({form:g.id,response:r})}).then(x=>x.json()).then(j=>{if(j&&j.closed&&j.error){g.form.open=false;g.form.responses=g.form.responses.filter(x=>x.id!==r.id);V.formDone=null;saveView();render();toast('방금 마감되어 신청이 접수되지 않았어요');}else if(j&&j.error)toast('신청 전달 실패: '+j.error);else if(j&&j.closed){g.form.open=false;render();}}).catch(()=>toast('전달 실패. 다시 시도해 주세요'));}catch(e){} }
async function refreshFormStatus(g){ if(!canFetch()) return; try{const r=await fetch(S.seller.syncUrl+'?form='+encodeURIComponent(g.id)); const j=await r.json(); if(j&&j.group&&j.group.form){const wasOpen=formOpen(g); g.form.open=!!j.group.form.open; g.form.responses=j.group.form.responses||g.form.responses; if(wasOpen!==formOpen(g)) render();}}catch(e){} }
setInterval(()=>{ if(formView){const g=S.groups.find(x=>x.id===formView); if(g&&formOpen(g)) refreshFormStatus(g);} },15000);
let wasWaiting=null; setInterval(()=>{ const g=G(); if(!g) return; const w=formWaiting(g); if(wasWaiting===true&&w===false) render(); wasWaiting=w; },5000);
function pushMember(m){ if(!canFetch()){save();return;} try{fetch(S.seller.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({member:m.id,name:m.name,phone:m.phone,zip:m.zip,addr:m.addr,addr2:m.addr2,memo:m.memo,delivery:m.delivery,cvs:m.cvs,cvsAddr:m.cvsAddr})}).then(r=>r.json()).then(j=>{if(j&&j.error)toast('전달 실패: '+j.error);else toast('배송지가 전달됐어요');}).catch(()=>toast('전달 실패. 다시 시도해 주세요'));}catch(e){} }
(async()=>{
  if(!canFetch()) return;
  try{
    if(formView){ const r=await fetch(S.seller.syncUrl+'?form='+encodeURIComponent(formView)); const j=await r.json();
      if(j&&j.group){ S.groups=[Object.assign(blankGroup(''),j.group,{members:[]})]; S.groups[0].form=Object.assign(blankForm(),j.group.form); V.gid=j.group.id; render(); } return; }
    if(personal){ const r=await fetch(S.seller.syncUrl+'?member='+encodeURIComponent(personal)); const j=await r.json();
      if(j&&j.group){ S.seller=Object.assign(S.seller,j.seller||{}); S.notice=j.notice||S.notice; S.groups=[Object.assign(j.group,{members:[Object.assign(blankMember(),j.member)]})]; if(!j.group.stepsV2)migrateSteps(S.groups[0]); V.gid=j.group.id; V.mid=j.member.id; render(); } }
    else if(V.adminKey){ const r=await fetch(S.seller.syncUrl+'?key='+encodeURIComponent(V.adminKey)); const j=await r.json();
      if(j&&j.groups){ S=j; S.seller=Object.assign(baseState().seller,S.seller||{}); S.groups.forEach(g=>{migrateSteps(g);g.members=g.members.map(m=>Object.assign(blankMember(),m));}); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} render(); toast('구글 시트에서 불러왔어요'); } else if(j&&j.error){ toast('시트 불러오기 실패: '+j.error); } }
  }catch(e){}
})();
fetchRates();
window.addEventListener('hashchange',()=>{readHash();render();});
render();
</script>
